<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLU Student Portal - Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            background-image: 
                radial-gradient(rgba(0, 0, 0, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, #f5f7fa, #e4e7eb);
            background-size: 4px 4px, 100% 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 40px;
        }

        .portal-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 700px;
            padding: 10px;
        }

        /* Header Brand Area */
        .brand-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            margin-bottom: 25px;
        }

        .crest-img {
            height: 210px;
            object-fit: contain;
        }

        /* Container to crop out the bottom screenshot artifact cleanly */
        .logo-wrapper {
            height: 165px;
            overflow: hidden;
            display: flex;
            align-items: flex-start;
        }

        .logo-img {
            height: 180px;
            object-fit: contain;
            margin-top: -5px;
        }

        /* Login Card */
        .login-card {
            background-color: #3b3b3b;
            width: 380px;
            border-radius: 10px;
            padding: 24px 28px 28px 28px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.35);
            position: relative;
        }

        .login-card::after {
            content: "🔒";
            position: absolute;
            top: -11px;
            right: 22px;
            background: #222222;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 11px;
            color: white;
            border: 1px solid #444;
        }

        .login-title {
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px dashed #555555;
        }

        .form-group {
            margin-bottom: 16px;
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 11px 12px 11px 38px;
            border: 1px solid #d1d5db;
            border-radius: 5px;
            font-size: 14px;
            background: #ffffff;
            color: #333333;
        }

        .input-icon {
            position: absolute;
            left: 12px;
            top: 12px;
            font-size: 14px;
        }

        .login-btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(to bottom, #6085b5, #4169aa);
            color: white;
            border: 1px solid #284c84;
            border-radius: 5px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            margin-top: 6px;
            margin-bottom: 16px;
            text-align: center;
            display: block;
            text-decoration: none;
        }

        .login-btn:hover {
            background: linear-gradient(to bottom, #4169aa, #284c84);
        }

        .card-footer {
            border-top: 1px dashed #555555;
            padding-top: 12px;
        }

        .card-footer a {
            color: #ffffff;
            font-size: 12px;
            text-decoration: none;
            display: block;
            margin-bottom: 4px;
        }

        .card-footer a:hover {
            text-decoration: underline;
        }

        /* --- MOBILE RESPONSIVE MEDIA QUERY --- */
        @media (max-width: 600px) {
            body {
                padding-top: 20px;
                height: auto;
                overflow: auto;
            }
            .portal-container {
                padding: 15px;
            }
            .brand-header {
                flex-direction: column;
                gap: 10px;
            }
            .crest-img {
                height: 140px;
            }
            .logo-wrapper {
                height: 110px;
            }
            .logo-img {
                height: 120px;
            }
            .login-card {
                width: 100%;
                max-width: 360px;
                padding: 18px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="portal-container">
        <!-- Header Brand Area -->
        <div class="brand-header">
            <img src="res/slu logo.png" class="crest-img" alt="SLU Crest">
            <div class="logo-wrapper">
                <img src="res/slu portal.png" class="logo-img" alt="SLU Portal Title">
            </div>
        </div>

        <!-- Login Box -->
        <div class="login-card">
            <div class="login-title">User Login</div>
            
            <form action="dashboard.html" method="GET">
                <div class="form-group">
                    <span class="input-icon">👤</span>
                    <input type="text" class="form-input" placeholder="ID Number" required>
                </div>

                <div class="form-group">
                    <span class="input-icon">🔑</span>
                    <input type="password" class="form-input" placeholder="Password" required>
                </div>

                <a href="dashboard.html" class="login-btn">Login</a>
            </form>

            <div class="card-footer">
                <a href="#">Forgot Password?</a>
                <a href="#">- Account Request</a>
            </div>
        </div>
    </div>

</body>
</html>
